{{ define "main" }}
    <h1><span class="prefix">></span>ls -la /posts/</h1>
    {{ range .Pages }}
        <article>
            <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
            <span class="post-meta">
                <span class="prefix">[</span><time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format `2006-01-02` }}</time><span class="prefix">]</span>
            </span>
            <p>{{ .Summary }}</p>
        </article>
    {{ end }}
{{ end }}
